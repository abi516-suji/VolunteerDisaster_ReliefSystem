<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | VDRCS</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">


    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            VDRCS
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html" class="active">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- Login -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to access the relief coordination system.
                </p>

            </div>


            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- Role -->

                <div class="form-group">

                    <label for="loginRole">
                        Login As
                    </label>

                    <select id="loginRole" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                        <option value="volunteer">
                            Volunteer
                        </option>

                        <option value="coordinator">
                            Relief Coordinator
                        </option>

                    </select>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn primary-btn full-btn"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
